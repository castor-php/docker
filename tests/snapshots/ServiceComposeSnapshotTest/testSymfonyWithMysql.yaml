services:
    mysql:
        image: 'mysql:8.0.46'
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: app
        volumes:
            - 'mysql-data:/var/lib/mysql'
        healthcheck:
            test: 'mysqladmin ping -h localhost'
            interval: 5s
            timeout: 5s
            retries: 5
        profiles:
            - default
    app:
        build:
            context: '%PACKAGE%/src/Service/../Resources/php'
            dockerfile: '%PACKAGE%/src/Service/../Resources/php/Dockerfile.frankenphp'
            target: frontend
            args:
                BUILDKIT_SYNTAX: 'ghcr.io/castor-php/twig-dockerfile:0.1'
                php_version: '8.5'
                php_extensions: '["apcu","bcmath","curl","iconv","intl","mbstring","pgsql","uuid","xml","zip"]'
            cache_from:
                - 'type=registry,ref=${REGISTRY:-}/app:cache'
        user: '1000:1000'
        environment:
            DATABASE_URL: 'mysql://root:root@mysql:3306/app'
        depends_on:
            mysql:
                condition: service_healthy
        volumes:
            - '/project/app:/var/www:cached'
            - '.home:/home/app:cached'
        labels:
            - caddy=app.demo.test
            - 'caddy.reverse_proxy={{upstreams 80}}'
            - caddy.tls=internal
            - caddy.tls.on_demand=
        profiles:
            - default
    app-builder:
        build:
            context: '%PACKAGE%/src/Service/../Resources/php'
            dockerfile: '%PACKAGE%/src/Service/../Resources/php/Dockerfile.frankenphp'
            target: builder
            args:
                BUILDKIT_SYNTAX: 'ghcr.io/castor-php/twig-dockerfile:0.1'
                php_version: '8.5'
                php_extensions: '["apcu","bcmath","curl","iconv","intl","mbstring","pgsql","uuid","xml","zip"]'
            cache_from:
                - 'type=registry,ref=${REGISTRY:-}/app-builder:cache'
        user: '1000:1000'
        init: true
        environment:
            DATABASE_URL: 'mysql://root:root@mysql:3306/app'
        depends_on:
            mysql:
                condition: service_healthy
        volumes:
            - '/project/app:/var/www:cached'
            - '.home:/home/app:cached'
            - '/project/.castor/vendor/.tools:/castor-tools:cached'
        profiles:
            - builder
volumes:
    mysql-data: {}
