services:
    mysql:
        image: 'mysql:8'
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: app
        volumes:
            - 'mysql-data:/var/lib/mysql'
        healthcheck:
            test: 'mysqladmin ping -h localhost'
            interval: 5s
            timeout: 5s
            retries: 5
        profiles:
            - default
    app:
        build:
            context: %PACKAGE%/src/Service/../Resources/php
            dockerfile: %PACKAGE%/src/Service/../Resources/php/Dockerfile
            target: frontend
            args:
                php_version: '8.5'
            cache_from:
                - 'type=registry,ref=${REGISTRY:-}/app:cache'
        user: '1000:1000'
        environment:
            DATABASE_URL: 'mysql://root:root@mysql:3306/app'
        depends_on:
            mysql:
                condition: service_healthy
        volumes:
            - '/project/app:/var/www:cached'
            - '.home:/home/app:cached'
        labels:
            - traefik.enable=true
            - traefik.http.routers.demo-app.rule=Host(`app.demo.test`)
            - traefik.http.routers.demo-app.tls=true
            - traefik.http.services.demo-app.loadbalancer.server.port=80
            - traefik.http.routers.demo-app-unsecure.rule=Host(`app.demo.test`)
            - traefik.http.routers.demo-app-unsecure.entrypoints=http
            - traefik.http.routers.demo-app-unsecure.middlewares=redirect-to-https@file
        profiles:
            - default
    app-builder:
        build:
            context: %PACKAGE%/src/Service/../Resources/php
            dockerfile: %PACKAGE%/src/Service/../Resources/php/Dockerfile
            target: builder
            args:
                php_version: '8.5'
            cache_from:
                - 'type=registry,ref=${REGISTRY:-}/app-builder:cache'
        user: '1000:1000'
        init: true
        environment:
            DATABASE_URL: 'mysql://root:root@mysql:3306/app'
        depends_on:
            mysql:
                condition: service_healthy
        volumes:
            - '/project/app:/var/www:cached'
            - '.home:/home/app:cached'
        profiles:
            - builder
volumes:
    mysql-data: {}
