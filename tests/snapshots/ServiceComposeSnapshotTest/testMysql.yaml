services:
    mysql:
        image: 'mysql:9.7.2'
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: app
        volumes:
            - 'mysql-data:/var/lib/mysql'
        healthcheck:
            test: 'mysqladmin ping -h 127.0.0.1 --silent'
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 2m
        profiles:
            - default
volumes:
    mysql-data: {}
