services:
    mysql:
        image: 'mysql:8.0.46'
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: app
        volumes:
            - 'mysql-data:/var/lib/mysql'
        healthcheck:
            test: 'mysqladmin ping -h localhost'
            interval: 5s
            timeout: 5s
            retries: 5
        profiles:
            - default
volumes:
    mysql-data: {}
