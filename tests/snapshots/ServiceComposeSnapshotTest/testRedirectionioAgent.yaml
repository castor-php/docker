services:
    redirectionio-agent:
        build:
            context: '%PACKAGE%/src/Service/../Resources/redirectionio-agent'
        labels:
            - castor.config.redirectionio-agent=0dbbcd4f9d7b
        profiles:
            - default
        configs:
            -
                source: redirectionio-agent
                target: /etc/redirectionio/agent.yml
volumes: {}
configs:
    redirectionio-agent:
        content: |
            # This file is generated by Castor. Do not edit it manually.
            instance:
                name: dev
                persist: false
            reverse_proxy:
                listen:
                    - 'tcp://0.0.0.0:80'
                trusted_proxies:
                    forwarded: true
                    x_forwarded_for: true
                    x_forwarded_host: true
                    x_forwarded_proto: true
