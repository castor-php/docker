services:
    elasticsearch:
        image: 'elasticsearch:7.8.0'
        environment:
            discovery.type: single-node
        volumes:
            - 'elasticsearch-data:/usr/share/elasticsearch/data'
        healthcheck:
            test:
                - CMD-SHELL
                - 'curl --fail http://localhost:9200/_cat/health || exit 1'
            interval: 5s
            timeout: 5s
            retries: 5
        labels:
            - caddy=elasticsearch.demo.test
            - 'caddy.reverse_proxy={{upstreams 9200}}'
            - caddy.tls=internal
            - caddy.tls.on_demand=
        profiles:
            - default
    kibana:
        image: 'kibana:7.8.0'
        depends_on:
            elasticsearch:
                condition: service_healthy
        labels:
            - caddy=kibana.demo.test
            - 'caddy.reverse_proxy={{upstreams 5601}}'
            - caddy.tls=internal
            - caddy.tls.on_demand=
        profiles:
            - default
volumes:
    elasticsearch-data: {}
