services:
    mariadb:
        image: 'mariadb:12.3.2'
        environment:
            MARIADB_ROOT_PASSWORD: root
            MARIADB_DATABASE: app
        volumes:
            - 'mariadb-data:/var/lib/mysql'
        healthcheck:
            test: 'healthcheck.sh --connect'
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 2m
        profiles:
            - default
volumes:
    mariadb-data: {}
