services:
    postgres:
        image: 'postgres:18.4'
        environment:
            POSTGRES_USER: app
            POSTGRES_PASSWORD: app
        volumes:
            - 'postgres_data:/var/lib/postgresql'
        healthcheck:
            test:
                - CMD-SHELL
                - 'pg_isready -U app -h 127.0.0.1'
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 2m
        profiles:
            - default
volumes:
    postgres_data: {}
