services:
    redis:
        image: 'redis:8.10'
        volumes:
            - 'redis-data:/data'
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            interval: 5s
            timeout: 5s
            retries: 5
        profiles:
            - default
    redis-insight:
        image: redis/redisinsight
        volumes:
            - 'redis-insight-data:/data'
        healthcheck:
            test:
                - CMD
                - wget
                - '--quiet'
                - '--spider'
                - 'http://127.0.0.1:5540/api/health'
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 1m
        labels:
            - caddy=redis.demo.test
            - 'caddy.reverse_proxy={{upstreams 5540}}'
            - caddy.tls=internal
            - caddy.tls.on_demand=
        profiles:
            - default
volumes:
    redis-data: {}
    redis-insight-data: {}
