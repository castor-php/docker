services:
    redis:
        image: 'redis:5'
        volumes:
            - 'redis-data:/data'
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            interval: 5s
            timeout: 5s
            retries: 5
        profiles:
            - default
    redis-insight:
        image: redislabs/redisinsight
        volumes:
            - 'redis-insight-data:/db'
        labels:
            - caddy=redis.demo.test
            - 'caddy.reverse_proxy={{upstreams 5540}}'
            - caddy.tls=internal
            - caddy.tls.on_demand=
        profiles:
            - default
volumes:
    redis-data: {}
    redis-insight-data: {}
