services:
    app:
        build:
            context: '%PACKAGE%/src/Service/../Resources/php'
            dockerfile: '%PACKAGE%/src/Service/../Resources/php/Dockerfile.frankenphp'
            target: frontend
            args:
                BUILDKIT_SYNTAX: 'ghcr.io/castor-php/twig-dockerfile:0.1'
                php_version: '8.5'
                php_extensions: '["apcu","bcmath","curl","iconv","intl","mbstring","pgsql","pdo_pgsql","uuid","xml","zip"]'
            cache_from:
                - 'type=registry,ref=${REGISTRY:-}/app:cache'
        user: '1000:1000'
        volumes:
            - '/project/app:/var/www:cached'
            - '.home:/home/app:cached'
        profiles:
            - default
    app-builder:
        build:
            context: '%PACKAGE%/src/Service/../Resources/php'
            dockerfile: '%PACKAGE%/src/Service/../Resources/php/Dockerfile.frankenphp'
            target: builder
            args:
                BUILDKIT_SYNTAX: 'ghcr.io/castor-php/twig-dockerfile:0.1'
                php_version: '8.5'
                php_extensions: '["apcu","bcmath","curl","iconv","intl","mbstring","pgsql","pdo_pgsql","uuid","xml","zip"]'
                node_version: 24.x
                package_manager: npm
            cache_from:
                - 'type=registry,ref=${REGISTRY:-}/app-builder:cache'
        user: '1000:1000'
        init: true
        volumes:
            - '/project/app:/var/www:cached'
            - '.home:/home/app:cached'
            - '/project/.castor/vendor/.tools:/castor-tools:cached'
        profiles:
            - builder
    api:
        build:
            context: '%PACKAGE%/src/Service/../Resources/rust'
            dockerfile: '%PACKAGE%/src/Service/../Resources/rust/Dockerfile'
            target: runtime
            args:
                BUILDKIT_SYNTAX: 'ghcr.io/castor-php/twig-dockerfile:0.1'
                rust_version: '1.90'
                rust_components: '["clippy","rustfmt"]'
                rust_targets: '[]'
                rust_toolchains: '[]'
            cache_from:
                - 'type=registry,ref=${REGISTRY:-}/api:cache'
        working_dir: /app
        user: '1000:1000'
        environment:
            HOME: /home/app
            CARGO_HOME: /home/app/.cargo
        volumes:
            - '/project/api:/app:cached'
            - '.home:/home/app:cached'
        profiles:
            - default
        command: /app/target/debug/api
    redirectionio-agent:
        build:
            context: '%PACKAGE%/src/Service/../Resources/redirectionio-agent'
        labels:
            - 'caddy=app.demo.test legacy.demo.test api.demo.test'
            - 'caddy.reverse_proxy={{upstreams 80}}'
            - caddy.tls=internal
            - caddy.tls.on_demand=
            - castor.config.redirectionio-agent=0584c4139025
        profiles:
            - default
        configs:
            -
                source: redirectionio-agent
                target: /etc/redirectionio/agent.yml
volumes: {}
configs:
    redirectionio-agent:
        content: |
            # This file is generated by Castor. Do not edit it manually.
            instance:
                name: dev
                persist: false
            reverse_proxy:
                listen:
                    - 'tcp://0.0.0.0:80'
                trusted_proxies:
                    forwarded: true
                    x_forwarded_for: true
                    x_forwarded_host: true
                    x_forwarded_proto: true
                virtual_hosts:
                    -
                        domains:
                            - app.demo.test
                        forward:
                            address: 'app:80'
                            tls: false
                            preserve_host: true
                        agent:
                            project_key: default-key
                    -
                        domains:
                            - legacy.demo.test
                        forward:
                            address: 'app:80'
                            tls: false
                            preserve_host: true
                        agent:
                            project_key: legacy-key
                    -
                        domains:
                            - api.demo.test
                        forward:
                            address: 'api:8080'
                            tls: false
                            preserve_host: true
                        agent:
                            project_key: default-key
