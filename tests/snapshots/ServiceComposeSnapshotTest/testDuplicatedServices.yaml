services:
    postgres:
        image: 'postgres:18.4'
        environment:
            POSTGRES_USER: app
            POSTGRES_PASSWORD: app
        volumes:
            - 'postgres_data:/var/lib/postgresql'
        healthcheck:
            test:
                - CMD-SHELL
                - 'pg_isready -U app -h 127.0.0.1'
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 2m
        profiles:
            - default
    analytics:
        image: 'postgres:18.4'
        environment:
            POSTGRES_USER: app
            POSTGRES_PASSWORD: app
        volumes:
            - 'analytics_data:/var/lib/postgresql'
        healthcheck:
            test:
                - CMD-SHELL
                - 'pg_isready -U app -h 127.0.0.1'
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 2m
        profiles:
            - default
    redis:
        image: 'redis:8.10'
        volumes:
            - 'redis-data:/data'
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            interval: 5s
            timeout: 5s
            retries: 5
        profiles:
            - default
    redis-insight:
        image: redis/redisinsight
        volumes:
            - 'redis-insight-data:/data'
        healthcheck:
            test:
                - CMD
                - wget
                - '--quiet'
                - '--spider'
                - 'http://127.0.0.1:5540/api/health'
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 1m
        labels:
            - caddy=redis.demo.test
            - 'caddy.reverse_proxy={{upstreams 5540}}'
            - caddy.tls=internal
            - caddy.tls.on_demand=
        profiles:
            - default
    sessions:
        image: 'redis:8.10'
        volumes:
            - 'sessions-data:/data'
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            interval: 5s
            timeout: 5s
            retries: 5
        profiles:
            - default
    sessions-insight:
        image: redis/redisinsight
        volumes:
            - 'sessions-insight-data:/data'
        healthcheck:
            test:
                - CMD
                - wget
                - '--quiet'
                - '--spider'
                - 'http://127.0.0.1:5540/api/health'
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 1m
        labels:
            - caddy=sessions.demo.test
            - 'caddy.reverse_proxy={{upstreams 5540}}'
            - caddy.tls=internal
            - caddy.tls.on_demand=
        profiles:
            - default
    elasticsearch:
        image: 'elasticsearch:9.5.3'
        environment:
            discovery.type: single-node
            xpack.security.enabled: 'false'
            ES_JAVA_OPTS: '-Xms512m -Xmx512m'
            cluster.routing.allocation.disk.threshold_enabled: 'false'
        volumes:
            - 'elasticsearch-data:/usr/share/elasticsearch/data'
        healthcheck:
            test:
                - CMD-SHELL
                - 'curl --fail http://localhost:9200/_cat/health || exit 1'
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 2m
        labels:
            - caddy=elasticsearch.demo.test
            - 'caddy.reverse_proxy={{upstreams 9200}}'
            - caddy.tls=internal
            - caddy.tls.on_demand=
        profiles:
            - default
    kibana:
        image: 'kibana:9.5.3'
        environment:
            ELASTICSEARCH_HOSTS: 'http://elasticsearch:9200'
        depends_on:
            elasticsearch:
                condition: service_healthy
        healthcheck:
            test:
                - CMD-SHELL
                - 'curl --fail http://localhost:5601/api/status || exit 1'
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 3m
        labels:
            - caddy=kibana.demo.test
            - 'caddy.reverse_proxy={{upstreams 5601}}'
            - caddy.tls=internal
            - caddy.tls.on_demand=
        profiles:
            - default
    logs:
        image: 'elasticsearch:9.5.3'
        environment:
            discovery.type: single-node
            xpack.security.enabled: 'false'
            ES_JAVA_OPTS: '-Xms512m -Xmx512m'
            cluster.routing.allocation.disk.threshold_enabled: 'false'
        volumes:
            - 'logs-data:/usr/share/elasticsearch/data'
        healthcheck:
            test:
                - CMD-SHELL
                - 'curl --fail http://localhost:9200/_cat/health || exit 1'
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 2m
        labels:
            - caddy=logs.demo.test
            - 'caddy.reverse_proxy={{upstreams 9200}}'
            - caddy.tls=internal
            - caddy.tls.on_demand=
        profiles:
            - default
    logs-kibana:
        image: 'kibana:9.5.3'
        environment:
            ELASTICSEARCH_HOSTS: 'http://logs:9200'
        depends_on:
            logs:
                condition: service_healthy
        healthcheck:
            test:
                - CMD-SHELL
                - 'curl --fail http://localhost:5601/api/status || exit 1'
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 3m
        labels:
            - caddy=logs-kibana.demo.test
            - 'caddy.reverse_proxy={{upstreams 5601}}'
            - caddy.tls=internal
            - caddy.tls.on_demand=
        profiles:
            - default
    events:
        build:
            context: '%PACKAGE%/src/Service/../Resources/clickhouse'
            dockerfile: Dockerfile
            args:
                BUILDKIT_SYNTAX: 'ghcr.io/castor-php/twig-dockerfile:0.1'
                clickhouse_version: '25.8'
                backup: ''
        environment:
            CLICKHOUSE_DB: app
            CLICKHOUSE_USER: app
            CLICKHOUSE_PASSWORD: app
            CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
            CLICKHOUSE_KEEPER_HOST: events-keeper
        volumes:
            - 'events-data:/var/lib/clickhouse'
        healthcheck:
            test:
                - CMD
                - wget
                - '--quiet'
                - '--spider'
                - 'http://127.0.0.1:8123/ping'
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 1m
        labels:
            - caddy=events.demo.test
            - 'caddy.reverse_proxy={{upstreams 8123}}'
            - caddy.tls=internal
            - caddy.tls.on_demand=
        profiles:
            - default
    events-keeper:
        build:
            context: '%PACKAGE%/src/Service/../Resources/clickhouse'
            dockerfile: Dockerfile.keeper
            args:
                BUILDKIT_SYNTAX: 'ghcr.io/castor-php/twig-dockerfile:0.1'
                clickhouse_version: '25.8'
        healthcheck:
            test:
                - CMD
                - clickhouse-keeper-client
                - '--host'
                - 127.0.0.1
                - '--port'
                - '9181'
                - '--query'
                - ruok
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 1m
        profiles:
            - default
    mercure:
        image: 'dunglas/mercure:v0.24.2'
        environment:
            SERVER_NAME: ':80'
            MERCURE_PUBLISHER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
            MERCURE_SUBSCRIBER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
            MERCURE_EXTRA_DIRECTIVES: |-
                anonymous
                subscriptions
                ui
            GLOBAL_OPTIONS: |-
                log default {
                	exclude admin.api
                }
        volumes:
            - 'mercure-data:/data'
        healthcheck:
            test:
                - CMD
                - wget
                - '-q'
                - '--spider'
                - 'http://127.0.0.1:2019/mercure/health/ready'
            interval: 5s
            timeout: 5s
            retries: 5
        labels:
            - caddy=mercure.demo.test
            - 'caddy.reverse_proxy={{upstreams 80}}'
            - caddy.tls=internal
            - caddy.tls.on_demand=
        profiles:
            - default
    notifications:
        image: 'dunglas/mercure:v0.24.2'
        environment:
            SERVER_NAME: ':80'
            MERCURE_PUBLISHER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
            MERCURE_SUBSCRIBER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
            MERCURE_EXTRA_DIRECTIVES: |-
                anonymous
                subscriptions
                ui
            GLOBAL_OPTIONS: |-
                log default {
                	exclude admin.api
                }
        volumes:
            - 'notifications-data:/data'
        healthcheck:
            test:
                - CMD
                - wget
                - '-q'
                - '--spider'
                - 'http://127.0.0.1:2019/mercure/health/ready'
            interval: 5s
            timeout: 5s
            retries: 5
        labels:
            - caddy=notifications.demo.test
            - 'caddy.reverse_proxy={{upstreams 80}}'
            - caddy.tls=internal
            - caddy.tls.on_demand=
        profiles:
            - default
    meilisearch:
        image: 'getmeili/meilisearch:v1.54'
        environment:
            MEILI_MASTER_KEY: castor-meilisearch-master-key
            MEILI_ENV: development
            MEILI_NO_ANALYTICS: 'true'
            MEILI_UPGRADE_DB: 'true'
        volumes:
            - 'meilisearch-data:/meili_data'
        healthcheck:
            test:
                - CMD
                - curl
                - '-fsS'
                - '-o'
                - /dev/null
                - 'http://127.0.0.1:7700/health'
            interval: 5s
            timeout: 5s
            retries: 5
        labels:
            - caddy=meilisearch.demo.test
            - 'caddy.reverse_proxy={{upstreams 7700}}'
            - caddy.tls=internal
            - caddy.tls.on_demand=
        profiles:
            - default
    catalog:
        image: 'getmeili/meilisearch:v1.54'
        environment:
            MEILI_MASTER_KEY: castor-meilisearch-master-key
            MEILI_ENV: development
            MEILI_NO_ANALYTICS: 'true'
            MEILI_UPGRADE_DB: 'true'
        volumes:
            - 'catalog-data:/meili_data'
        healthcheck:
            test:
                - CMD
                - curl
                - '-fsS'
                - '-o'
                - /dev/null
                - 'http://127.0.0.1:7700/health'
            interval: 5s
            timeout: 5s
            retries: 5
        labels:
            - caddy=catalog.demo.test
            - 'caddy.reverse_proxy={{upstreams 7700}}'
            - caddy.tls=internal
            - caddy.tls.on_demand=
        profiles:
            - default
    rustfs:
        image: 'rustfs/rustfs:1.0.0'
        environment:
            RUSTFS_ACCESS_KEY: castor
            RUSTFS_SECRET_KEY: castor-secret-key
            RUSTFS_CONSOLE_ENABLE: 'true'
            RUSTFS_CORS_ALLOWED_ORIGINS: '*'
            RUSTFS_OBS_LOG_DIRECTORY: ''
        volumes:
            - 'rustfs-data:/data'
        healthcheck:
            test:
                - CMD
                - curl
                - '-fsS'
                - '-o'
                - /dev/null
                - 'http://127.0.0.1:9000/health/ready'
            interval: 5s
            timeout: 5s
            retries: 5
        labels:
            - caddy=rustfs.demo.test
            - 'caddy.reverse_proxy={{upstreams 9000}}'
            - caddy.tls=internal
            - caddy.tls.on_demand=
            - caddy_2=rustfs-console.demo.test
            - 'caddy_2.reverse_proxy={{upstreams 9001}}'
            - caddy_2.tls=internal
            - caddy_2.tls.on_demand=
        profiles:
            - default
    rustfs-buckets:
        image: 'rustfs/rc:v0.1.36'
        restart: 'no'
        environment:
            RC_HOST_local: 'http://castor:castor-secret-key@rustfs:9000'
        depends_on:
            rustfs:
                condition: service_healthy
        profiles:
            - default
        entrypoint:
            - /bin/sh
            - '-ec'
        command:
            - 'rc bucket create --ignore-existing local/uploads'
    backups:
        image: 'rustfs/rustfs:1.0.0'
        environment:
            RUSTFS_ACCESS_KEY: castor
            RUSTFS_SECRET_KEY: castor-secret-key
            RUSTFS_CONSOLE_ENABLE: 'true'
            RUSTFS_CORS_ALLOWED_ORIGINS: '*'
            RUSTFS_OBS_LOG_DIRECTORY: ''
        volumes:
            - 'backups-data:/data'
        healthcheck:
            test:
                - CMD
                - curl
                - '-fsS'
                - '-o'
                - /dev/null
                - 'http://127.0.0.1:9000/health/ready'
            interval: 5s
            timeout: 5s
            retries: 5
        labels:
            - caddy=backups.demo.test
            - 'caddy.reverse_proxy={{upstreams 9000}}'
            - caddy.tls=internal
            - caddy.tls.on_demand=
            - caddy_2=backups-console.demo.test
            - 'caddy_2.reverse_proxy={{upstreams 9001}}'
            - caddy_2.tls=internal
            - caddy_2.tls.on_demand=
        profiles:
            - default
    backups-buckets:
        image: 'rustfs/rc:v0.1.36'
        restart: 'no'
        environment:
            RC_HOST_local: 'http://castor:castor-secret-key@backups:9000'
        depends_on:
            backups:
                condition: service_healthy
        profiles:
            - default
        entrypoint:
            - /bin/sh
            - '-ec'
        command:
            - 'rc bucket create --ignore-existing local/archives'
volumes:
    postgres_data: {}
    analytics_data: {}
    redis-data: {}
    redis-insight-data: {}
    sessions-data: {}
    sessions-insight-data: {}
    elasticsearch-data: {}
    logs-data: {}
    events-data: {}
    mercure-data: {}
    notifications-data: {}
    meilisearch-data: {}
    catalog-data: {}
    rustfs-data: {}
    backups-data: {}
