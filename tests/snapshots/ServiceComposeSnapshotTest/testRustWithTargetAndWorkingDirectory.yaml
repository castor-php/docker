services:
    agent:
        build:
            context: '%PACKAGE%/src/Service/../Resources/rust'
            dockerfile: '%PACKAGE%/src/Service/../Resources/rust/Dockerfile'
            target: runtime
            args:
                BUILDKIT_SYNTAX: 'ghcr.io/castor-php/twig-dockerfile:0.1'
                rust_version: '1.90'
                rust_components: '["clippy","rustfmt"]'
                rust_targets: '["x86_64-unknown-linux-musl"]'
                rust_toolchains: '[{"name":"nightly","components":["rustfmt"]}]'
            cache_from:
                - 'type=registry,ref=${REGISTRY:-}/agent:cache'
        working_dir: /app/agent/agent-application
        user: '1000:1000'
        environment:
            HOME: /home/app
            CARGO_HOME: /home/app/.cargo
        volumes:
            - '/project:/app:cached'
            - '.home:/home/app:cached'
        profiles:
            - default
        command:
            - /app/target/x86_64-unknown-linux-musl/debug/agent
            - '--listen'
            - '0.0.0.0:18089'
volumes: {}
