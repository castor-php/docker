services:
    clickhouse:
        build:
            context: '%PACKAGE%/src/Service/../Resources/clickhouse'
            dockerfile: Dockerfile
            args:
                BUILDKIT_SYNTAX: 'ghcr.io/castor-php/twig-dockerfile:0.1'
                clickhouse_version: '25.8'
                backup: ''
        environment:
            CLICKHOUSE_DB: app
            CLICKHOUSE_USER: app
            CLICKHOUSE_PASSWORD: app
            CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
            CLICKHOUSE_KEEPER_HOST: clickhouse-keeper
        volumes:
            - 'clickhouse-data:/var/lib/clickhouse'
        healthcheck:
            test:
                - CMD
                - wget
                - '--quiet'
                - '--spider'
                - 'http://127.0.0.1:8123/ping'
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 1m
        labels:
            - caddy=clickhouse.demo.test
            - 'caddy.reverse_proxy={{upstreams 8123}}'
            - caddy.tls=internal
            - caddy.tls.on_demand=
        profiles:
            - default
        configs:
            -
                source: clickhouse-backups
                target: /etc/clickhouse-server/config.d/castor-backups.xml
    clickhouse-keeper:
        build:
            context: '%PACKAGE%/src/Service/../Resources/clickhouse'
            dockerfile: Dockerfile.keeper
            args:
                BUILDKIT_SYNTAX: 'ghcr.io/castor-php/twig-dockerfile:0.1'
                clickhouse_version: '25.8'
        healthcheck:
            test:
                - CMD
                - clickhouse-keeper-client
                - '--host'
                - 127.0.0.1
                - '--port'
                - '9181'
                - '--query'
                - ruok
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 1m
        profiles:
            - default
volumes:
    clickhouse-data: {}
configs:
    clickhouse-backups:
        content: |-
            <clickhouse>
                <backups>
                    <allowed_path>/var/lib/clickhouse/backups/</allowed_path>
                </backups>
            </clickhouse>