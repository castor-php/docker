services:
    api:
        image: 'golang:1.25'
        working_dir: /app
        user: '1000:1000'
        environment:
            HOME: /home/app
        volumes:
            - '/project/api:/app:cached'
            - '.home:/home/app:cached'
        labels:
            - caddy=api.demo.test
            - 'caddy.reverse_proxy={{upstreams 80}}'
            - caddy.tls=internal
            - caddy.tls.on_demand=
        profiles:
            - default
        command: /app/api
volumes: {}
