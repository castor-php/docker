services:
    api:
        build:
            context: %PACKAGE%/src/Service/../Resources/go
            dockerfile: %PACKAGE%/src/Service/../Resources/go/Dockerfile
            target: runtime
            args:
                BUILDKIT_SYNTAX: 'ghcr.io/castor-php/twig-dockerfile:0.1'
                go_version: '1.25'
            cache_from:
                - 'type=registry,ref=${REGISTRY:-}/api:cache'
        working_dir: /app
        user: '1000:1000'
        environment:
            HOME: /home/app
        volumes:
            - '/project/api:/app:cached'
            - '.home:/home/app:cached'
        labels:
            - caddy=api.demo.test
            - 'caddy.reverse_proxy={{upstreams 80}}'
            - caddy.tls=internal
            - caddy.tls.on_demand=
        profiles:
            - default
        command: /app/api
volumes: {}
