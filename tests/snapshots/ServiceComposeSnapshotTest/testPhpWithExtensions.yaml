services:
    app:
        build:
            context: %PACKAGE%/src/Service/../Resources/php
            dockerfile: %PACKAGE%/src/Service/../Resources/php/Dockerfile.frankenphp
            target: frontend
            args:
                php_version: '8.5'
                php_extensions: '["apcu","bcmath","curl","iconv","intl","mbstring","pgsql","uuid","xml","zip","redis","amqp"]'
            cache_from:
                - 'type=registry,ref=${REGISTRY:-}/app:cache'
        user: '1000:1000'
        volumes:
            - '/project/app:/var/www:cached'
            - '.home:/home/app:cached'
        profiles:
            - default
    app-builder:
        build:
            context: %PACKAGE%/src/Service/../Resources/php
            dockerfile: %PACKAGE%/src/Service/../Resources/php/Dockerfile.frankenphp
            target: builder
            args:
                php_version: '8.5'
                php_extensions: '["apcu","bcmath","curl","iconv","intl","mbstring","pgsql","uuid","xml","zip","redis","amqp"]'
            cache_from:
                - 'type=registry,ref=${REGISTRY:-}/app-builder:cache'
        user: '1000:1000'
        init: true
        volumes:
            - '/project/app:/var/www:cached'
            - '.home:/home/app:cached'
        profiles:
            - builder
volumes: {}
