            args:
                php_version: '8.5'
                php_extensions: '["apcu","bcmath","curl","iconv","intl","mbstring","pgsql","uuid","xml","zip","redis"]'
            cache_from:
                - 'type=registry,ref=${REGISTRY:-}/app1:cache'
        user: %UID%
        environment:
            DATABASE_URL: 'postgresql://app:app@postgres:5432/app?serverVersion=16&charset=utf8'
        depends_on:
            postgres:
                condition: service_healthy
