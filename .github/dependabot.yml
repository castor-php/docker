version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Let a release settle before picking it up, in case it gets pulled
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  # Only the root manifest: example/app1 and example/app2 are test fixtures
  # deliberately pinned to specific Symfony and PHP versions
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      composer:
        patterns:
          - "*"
