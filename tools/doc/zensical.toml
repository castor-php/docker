[project]
site_name = "Castor Docker - Docker environments for PHP"
site_description = "A Castor plugin that generates your Docker Compose stack and the tasks to drive it, for PHP applications and everything around them."
site_url = "https://castor-php.github.io/docker/"
repo_url = "https://github.com/castor-php/docker"
edit_uri = "edit/main/doc/"
docs_dir = "doc"
exclude_docs = "_nav.md"
extra_javascript = [
  "assets/javascripts/highlight.min.js",
]
extra_css = [
  "assets/stylesheets/highlight-github.min.css",
  "assets/stylesheets/jolicode.css",
]

[project.theme]
logo = "assets/logo_CASTOR_line.svg"
favicon = "assets/favicon.png"
language = "en"
custom_dir = "overrides"
features = [
  "content.action.edit",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.integrate",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

# Palette toggle for automatic mode
[[project.theme.palette]]
media = "(prefers-color-scheme)"
scheme = "default"
primary = "white"
accent = "amber"
toggle.icon = "material/brightness-auto"
toggle.name = "Switch to light mode"

# Palette toggle for light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "white"
accent = "amber"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

# Palette toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "amber"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to system preference"

[project.extra]
generator = false

[[project.extra.social]]
icon = "fontawesome/brands/github-alt"
link = "https://github.com/castor-php"

[[project.extra.social]]
icon = "fontawesome/brands/x-twitter"
link = "https://x.com/jolicode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
"github-callouts" = {}
footnotes = {}
pymdownx.details = {}
pymdownx.highlight.use_pygments = false
pymdownx.inlinehilite = {}
pymdownx.snippets = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tabbed.slugify.object = "pymdownx.slugs.slugify"
pymdownx.tabbed.slugify.kwds.case = "lower"
toc.permalink = true

[project.plugins.search]

[project.plugins."literate-nav"]
nav_file = "_nav.md"

# The pages opt in with "render_macros: true": most of them show Twig syntax that must stay as is.
[project.plugins.macros]
render_by_default = false
on_error_fail = true

[project.plugins.social]
cards_layout_dir = "cards-layouts"
cards_layout = "custom"
cards_layout_options.font_family = "Noto Sans SC"
cards_layout_options.background_color = "white"
